<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";
  import { 
    getAuth, 
    createUserWithEmailAndPassword, 
    signInWithEmailAndPassword, 
    sendEmailVerification 
  } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js";
  import { 
    getFirestore, 
    doc, 
    setDoc, 
    serverTimestamp 
  } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-firestore.js";

  // 🔥 Твоя конфигурация Firebase
  const firebaseConfig = {
    apiKey: "AIzaSyD53xU1Kckb9eISmk7lNZqVtyTHrPLUhZM",
    authDomain: "simplelinkchat.firebaseapp.com",
    projectId: "simplelinkchat",
    storageBucket: "simplelinkchat.firebasestorage.app",
    messagingSenderId: "146229115991",
    appId: "1:146229115991:web:9b4683658565fe00ff7712"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  // 🔹 Элементы
  const emailEl = document.getElementById("email");
  const passEl = document.getElementById("password");
  const usernameEl = document.getElementById("username");
  const btn = document.getElementById("action-btn");
  const toggle = document.getElementById("toggle");
  const title = document.getElementById("title");
  const toast = document.getElementById("toast");

  let isLogin = true;

  // 🔹 Вспомогательная функция
  function showToast(msg, ok = true) {
    toast.textContent = msg;
    toast.style.backgroundColor = ok ? "#2ecc71" : "#e74c3c";
    toast.classList.add("show");
    setTimeout(() => toast.classList.remove("show"), 3000);
  }

  // 🔹 Переключение "вход / регистрация"
  toggle.onclick = () => {
    isLogin = !isLogin;
    usernameEl.style.display = isLogin ? "none" : "block";

    if (isLogin) {
      title.textContent = "Вход в Simple Link Chat";
      btn.textContent = "Войти";
      toggle.textContent = "Нет аккаунта? Зарегистрироваться";
      if (document.getElementById("repeatPass")) 
        document.getElementById("repeatPass").remove();
    } else {
      title.textContent = "Регистрация в Simple Link Chat";
      btn.textContent = "Зарегистрироваться";
      toggle.textContent = "Уже есть аккаунт? Войти";

      if (!document.getElementById("repeatPass")) {
        const repeatInput = document.createElement("input");
        repeatInput.type = "password";
        repeatInput.placeholder = "Повторите пароль";
        repeatInput.id = "repeatPass";
        repeatInput.style.cssText = "padding:10px;margin:5px;border-radius:8px;border:none;width:250px;font-size:16px;";
        passEl.insertAdjacentElement("afterend", repeatInput);
      }
    }
  };

  // 🔹 Обработка входа / регистрации
  btn.onclick = async () => {
    const email = emailEl.value.trim();
    const pass = passEl.value.trim();
    const username = usernameEl.value.trim();
    const repeat = document.getElementById("repeatPass")?.value.trim();

    if (!email || !pass) 
      return showToast("Введите email и пароль", false);

    if (!isLogin) {
      if (!username) return showToast("Введите юзернейм", false);
      if (pass !== repeat) return showToast("Пароли не совпадают", false);
    }

    try {
      if (isLogin) {
        const userCred = await signInWithEmailAndPassword(auth, email, pass);
        if (!userCred.user.emailVerified) {
          showToast("Подтвердите email перед входом", false);
          return;
        }
        showToast("✅ Успешный вход!");
        window.location.href = "chat.html";
      } else {
        // 🟢 Регистрация
        const userCred = await createUserWithEmailAndPassword(auth, email, pass);
        await sendEmailVerification(userCred.user);

        await setDoc(doc(db, "users", userCred.user.uid), {
          username: username,
          createdAt: serverTimestamp()
        });

        showToast("📩 Код подтверждения отправлен на почту!");

        // 🔁 Проверяем каждые 3 сек, подтвердил ли пользователь email
        const interval = setInterval(async () => {
          await userCred.user.reload();
          if (userCred.user.emailVerified) {
            clearInterval(interval);
            showToast("✅ Почта подтверждена! Вход...");
            window.location.href = "chat.html";
          }
        }, 3000);
      }
    } catch (err) {
      console.error(err);
      showToast(err.message, false);
    }
  };
</script>
