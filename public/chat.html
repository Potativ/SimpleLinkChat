<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Simple Link Chat — Чаты</title>
<style>
:root {
  --bg: #0f0f0f;
  --panel: #1a1a1a;
  --accent: #5865f2;
  --muted: #888;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  display: flex;
  height: 100vh;
  background: var(--bg);
  color: #fff;
  font-family: Arial, sans-serif;
}
/* Сайдбар */
#sidebar {
  width: 280px;
  background: var(--panel);
  border-right: 1px solid #222;
  display: flex;
  flex-direction: column;
  padding: 12px;
}
#topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
#search {
  background: #0d0d0d;
  border: 1px solid #333;
  color: white;
  border-radius: 8px;
  padding: 8px;
  width: 100%;
  margin-top: 10px;
}
#chatList {
  flex: 1;
  overflow-y: auto;
  margin-top: 10px;
}
.chat-item {
  padding: 10px;
  border-radius: 8px;
  cursor: pointer;
  transition: background 0.2s;
}
.chat-item:hover { background: #232323; }
.chat-item.active { background: #333; }
/* Окно чата */
#chatWindow {
  flex: 1;
  display: flex;
  flex-direction: column;
}
header {
  background: #131313;
  border-bottom: 1px solid #222;
  padding: 10px 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
#messages {
  flex: 1;
  padding: 16px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.msg {
  background: #222;
  padding: 10px 12px;
  border-radius: 8px;
  max-width: 70%;
  word-wrap: break-word;
}
.msg.own { align-self: flex-end; background: var(--accent); }
.msg .meta { font-size: 11px; color: var(--muted); margin-top: 5px; }
#inputArea {
  display: flex;
  gap: 8px;
  padding: 12px;
  border-top: 1px solid #222;
  background: #111;
}
#messageInput {
  flex: 1;
  padding: 8px;
  border-radius: 8px;
  border: 1px solid #333;
  background: #0d0d0d;
  color: white;
}
#sendBtn {
  background: var(--accent);
  color: white;
  border: none;
  border-radius: 8px;
  padding: 8px 12px;
  cursor: pointer;
}
/* Настройки */
#settingsModal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  display: none;
  align-items: center;
  justify-content: center;
}
#settingsBox {
  background: #121212;
  padding: 18px;
  border-radius: 10px;
  width: 320px;
}
#settingsBox input {
  width: 100%;
  padding: 8px;
  margin-top: 4px;
  border-radius: 8px;
  border: 1px solid #333;
  background: #0d0d0d;
  color: white;
}
button { cursor: pointer; }
</style>
</head>
<body>

<!-- Сайдбар -->
<div id="sidebar">
  <div id="topbar">
    <h3>Чаты</h3>
    <button id="settingsBtn">⚙️</button>
  </div>
  <input id="search" placeholder="🔍 Поиск по @username или ID">
  <div id="chatList"></div>
</div>

<!-- Основное окно -->
<div id="chatWindow">
  <header>
    <div id="chatTitle">—</div>
    <div id="myInfo" style="font-size:13px; color:#888;"></div>
  </header>
  <div id="messages"></div>
  <div id="inputArea">
    <input id="messageInput" placeholder="Введите сообщение...">
    <button id="sendBtn">Отправить</button>
  </div>
</div>

<!-- Настройки -->
<div id="settingsModal">
  <div id="settingsBox">
    <h3>Мой профиль</h3>
    <label>Никнейм:</label>
    <input id="nickInput">
    <label>Юзернейм (@):</label>
    <input id="usernameInput" readonly>
    <label>Мой ID:</label>
    <input id="userIdInput" readonly>
    <button id="closeSettings" style="margin-top:10px;width:100%;padding:8px;border:none;background:var(--accent);color:white;border-radius:8px;">Закрыть</button>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();

// ---------- Данные ----------
let data = JSON.parse(localStorage.getItem("slc_user") || "null");
if (!data) {
  alert("Ошибка: вы не вошли в систему!");
  window.location.href = "index.html";
}

// ---------- Элементы ----------
const chatList = document.getElementById("chatList");
const messagesEl = document.getElementById("messages");
const messageInput = document.getElementById("messageInput");
const sendBtn = document.getElementById("sendBtn");
const searchBox = document.getElementById("search");
const settingsBtn = document.getElementById("settingsBtn");
const settingsModal = document.getElementById("settingsModal");
const nickInput = document.getElementById("nickInput");
const usernameInput = document.getElementById("usernameInput");
const userIdInput = document.getElementById("userIdInput");
const closeSettings = document.getElementById("closeSettings");
const chatTitle = document.getElementById("chatTitle");
const myInfo = document.getElementById("myInfo");

// ---------- Подключение ----------
socket.emit("join", { userId: data.userId, nick: data.nick, avatar: data.avatar });

myInfo.textContent = `@${data.username}`;
nickInput.value = data.nick;
usernameInput.value = data.username;
userIdInput.value = data.userId;

// ---------- Сообщения ----------
sendBtn.onclick = () => {
  const text = messageInput.value.trim();
  if (!text) return;
  if (!data.currentChat) return alert("Сначала выберите чат!");
  socket.emit("privateMessage", { toUserId: data.currentChat, text });
  messageInput.value = "";
};

socket.on("privateMessage", (msg) => {
  renderMessage(msg);
});

function renderMessage(msg) {
  const div = document.createElement("div");
  div.className = "msg" + (msg.from.userId === data.userId ? " own" : "");
  div.innerHTML = `
    <div><strong>${msg.from.nick}</strong></div>
    <div>${msg.text}</div>
    <div class="meta">${new Date(msg.time).toLocaleTimeString()}</div>
  `;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

// ---------- Поиск ----------
searchBox.addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    const query = searchBox.value.trim();
    if (!query) return;
    socket.emit("findUser", query, (res) => {
      if (res.success) {
        alert(`Найден: ${res.user.nick} (@${res.userId})`);
        data.currentChat = res.user.userId;
        chatTitle.textContent = res.user.nick;
        localStorage.setItem("slc_user", JSON.stringify(data));
      } else {
        alert("Пользователь не найден");
      }
    });
  }
});

// ---------- Настройки ----------
settingsBtn.onclick = () => { settingsModal.style.display = "flex"; };
closeSettings.onclick = () => { settingsModal.style.display = "none"; };

// ---------- Инициализация ----------
if (!data.currentChat) {
  chatTitle.textContent = "Выберите собеседника";
}
</script>
</body>
</html>
