<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Чат | Simple Link Chat</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #0f0f0f;
      color: white;
      margin: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
    }
    #message-input {
      display: flex;
      padding: 10px;
      background-color: #1a1a1a;
    }
    #message {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-size: 16px;
    }
    button {
      margin-left: 8px;
      padding: 10px 15px;
      background-color: #5865f2;
      border: none;
      border-radius: 6px;
      color: white;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover {
      background-color: #4752c4;
    }
    #search-container {
      background-color: #1a1a1a;
      padding: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    #search-input {
      flex: 1;
      padding: 8px;
      border-radius: 6px;
      border: none;
      font-size: 16px;
    }
    #private {
      font-size: 14px;
      color: #aaa;
      margin-left: 10px;
    }
    .msg {
      padding: 8px;
      margin: 5px 0;
      border-radius: 6px;
      max-width: 70%;
      line-height: 1.4em;
    }
    .mine {
      background-color: #3a3a3a;
      align-self: flex-end;
    }
    .other {
      background-color: #222;
      align-self: flex-start;
    }
    .private {
      border: 1px solid #ff9800;
    }
  </style>
</head>
<body>
  <div id="search-container">
    <input id="search-input" type="text" placeholder="Введите user ID для поиска..." />
    <button id="search-btn">Найти</button>
    <span id="private"></span>
  </div>

  <div id="chat"></div>

  <div id="message-input">
    <input id="message" type="text" placeholder="Введите сообщение..." />
    <button id="send">Отправить</button>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    // 🧠 Локальный "профиль" (можно потом взять из auth)
    const userId = localStorage.getItem("userId") || "user_" + Math.random().toString(36).substring(2, 10);
    const nick = localStorage.getItem("nick") || "Пользователь_" + Math.floor(Math.random() * 1000);

    localStorage.setItem("userId", userId);
    localStorage.setItem("nick", nick);

    socket.emit("join", { userId, nick });
    console.log("🟢 Вы вошли как", nick, `(${userId})`);

    const chat = document.getElementById("chat");
    const msgInput = document.getElementById("message");
    const sendBtn = document.getElementById("send");
    const searchInput = document.getElementById("search-input");
    const searchBtn = document.getElementById("search-btn");
    const privateInfo = document.getElementById("private");

    let privateUser = null; // кому отправляем личные

    // 📩 Отправка сообщения
    sendBtn.onclick = () => {
      const text = msgInput.value.trim();
      if (!text) return;
      if (privateUser) {
        socket.emit("privateMessage", { toUserId: privateUser, text });
      } else {
        socket.emit("message", text);
      }
      msgInput.value = "";
    };

    // 📥 Получение общих сообщений
    socket.on("message", (msg) => {
      addMessage(msg.nick, msg.text, msg.id === socket.id ? "mine" : "other");
    });

    // 💌 Получение личных сообщений
    socket.on("privateMessage", (msg) => {
      const sender = msg.from.nick === nick ? "Вы" : msg.from.nick;
      addMessage(sender, `(ЛС) ${msg.text}`, msg.from.userId === userId ? "mine private" : "other private");
    });

    // 🔍 Поиск пользователя
    searchBtn.onclick = () => {
      const query = searchInput.value.trim();
      if (!query) return;

      socket.emit("findUser", query, (res) => {
        if (res.success) {
          privateUser = res.user.userId;
          privateInfo.textContent = `Личные сообщения с ${res.user.nick}`;
          privateInfo.style.color = "#ff9800";
        } else {
          privateUser = null;
          privateInfo.textContent = "❌ Пользователь не найден";
          privateInfo.style.color = "red";
        }
      });
    };

    // 📤 Добавление сообщения в чат
    function addMessage(nick, text, cls = "other") {
      const div = document.createElement("div");
      div.className = "msg " + cls;
      div.textContent = `${nick}: ${text}`;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }
  </script>
</body>
</html>
